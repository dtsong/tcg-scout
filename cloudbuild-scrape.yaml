steps:
  # Restore cached SQLite databases from GCS
  - id: restore-db-cache
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        gsutil -m cp "gs://${_CACHE_BUCKET}/scout-dbs/*.db" data/ || echo "WARNING: DB cache restore failed (exit $?), starting fresh"

  # Restore exported JSON for every frozen format.
  #
  # A frozen format's dataset window has closed, so its export is byte-stable --
  # recomputing it each run cost ~20 min per format and was what pushed this
  # build past its deadline. Instead each frozen export is snapshotted to GCS
  # once and restored here. A missing snapshot is NOT fatal: the scrape step
  # detects the gap and seeds it (see `seed-frozen` below).
  - id: restore-frozen
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        for slug in ${_FROZEN_FORMATS}; do
          dest="/workspace/web/public/data/$slug"
          mkdir -p "$dest"
          if gsutil cp "gs://${_CACHE_BUCKET}/frozen/$slug-data.tar.gz" "/tmp/$slug.tar.gz" 2>/dev/null; then
            tar -xzf "/tmp/$slug.tar.gz" -C "$dest"
            echo "Restored frozen $slug"
          else
            echo "No frozen snapshot for $slug -- will be seeded this run"
          fi
        done

  # Single Python step -- the uv venv + cache live in /workspace (shared across
  # steps), so the later `validate` step reuses them. `--no-dev` = runtime only;
  # `--locked` fails if uv.lock is stale vs pyproject.toml.
  - id: scrape
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    entrypoint: bash
    env: ["UV_CACHE_DIR=/workspace/.uv-cache"]
    args:
      - -c
      - |
        set -eu
        uv sync --locked --no-dev

        # JP City League is only scraped for the active format. tpci-standard is
        # active but ingested out of band (operator runs scrape-tpci + meta), so
        # it is export-only here -- its cached DB already carries a meta_snapshot.
        for slug in ${_SCRAPE_FORMATS}; do
          echo "=== scraping $slug ==="
          uv run python cli.py --format "$slug" init
          uv run python cli.py --format "$slug" scrape --no-decklists
          uv run python cli.py --format "$slug" scrape-jp --no-decklists
          uv run python cli.py --format "$slug" backfill-archetypes
          uv run python cli.py --format "$slug" translate-cards
          uv run python cli.py --format "$slug" meta
        done

        # Active formats are re-exported every run -- their data still moves.
        for slug in $(uv run python cli.py formats-list --status active); do
          echo "=== exporting active $slug ==="
          uv run python cli.py --format "$slug" export-web --strict
        done

        # Frozen formats are exported ONLY when restore-frozen found no snapshot.
        # meta.json is the marker the restore would have produced.
        for slug in $(uv run python cli.py formats-list --status frozen); do
          if [ -f "web/public/data/$slug/meta.json" ]; then
            echo "=== frozen $slug restored from snapshot, skipping export ==="
          else
            echo "=== seeding frozen $slug (one-time export) ==="
            uv run python cli.py --format "$slug" export-web --strict
            touch "/workspace/.seed-$slug"
          fi
        done
    waitFor: ["restore-db-cache", "restore-frozen"]

  # Upload snapshots for any frozen format seeded this run, so subsequent runs
  # restore instead of recomputing. Marker files are written by the scrape step.
  - id: seed-frozen
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        for slug in ${_FROZEN_FORMATS}; do
          [ -f "/workspace/.seed-$slug" ] || continue
          src="/workspace/web/public/data/$slug"
          tar -czf "/tmp/$slug-data.tar.gz" -C "$src" .
          gsutil cp "/tmp/$slug-data.tar.gz" "gs://${_CACHE_BUCKET}/frozen/$slug-data.tar.gz"
          echo "Seeded frozen snapshot for $slug"
        done
    waitFor: ["scrape"]

  # Validate exported data and database integrity before saving
  - id: validate
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    entrypoint: bash
    env: ["UV_CACHE_DIR=/workspace/.uv-cache"]
    args:
      - -c
      - |
        uv sync --locked --no-dev &&
        for fmt in ninja-spinner tpci-standard tpci-standard-2025 tpci-standard-2024; do
          uv run python cli.py --format "$${fmt}" validate
        done
    waitFor: ["scrape"]

  # Save SQLite databases to GCS for next run
  - id: save-db-cache
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - gsutil -m cp data/*.db "gs://${_CACHE_BUCKET}/scout-dbs/"
    waitFor: ["validate"]

  # Tar and upload exported JSON data to GCS (public bucket, no signed URLs)
  - id: upload-data
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        TIMESTAMP=$$(date -u +%Y%m%dT%H%M%SZ)
        TAR_FILE="data-$${TIMESTAMP}.tar.gz"
        GCS_PATH="gs://${_DATA_BUCKET}/$${TAR_FILE}"
        PUBLIC_URL="https://storage.googleapis.com/${_DATA_BUCKET}/$${TAR_FILE}"

        echo "Creating data archive..."
        tar -czf "/tmp/$${TAR_FILE}" --exclude='._*' -C /workspace/web/public/data .

        echo "Uploading to $${GCS_PATH}..."
        gsutil cp "/tmp/$${TAR_FILE}" "$${GCS_PATH}"
        gsutil cp "$${GCS_PATH}" "gs://${_DATA_BUCKET}/data-latest.tar.gz"

        SHA256=$$(sha256sum "/tmp/$${TAR_FILE}" | cut -d' ' -f1)

        echo "Writing manifest..."
        cat > /workspace/web/data-manifest.json <<MANIFEST_EOF
        {
          "version": 1,
          "archives": [
            {
              "url": "$${PUBLIC_URL}",
              "sha256": "$${SHA256}",
              "created_at": "$${TIMESTAMP}"
            }
          ]
        }
        MANIFEST_EOF

        echo "Manifest written. SHA-256: $${SHA256}"
    waitFor: ["save-db-cache"]

  # Commit manifest and push (lightweight, no JSON data)
  - id: push-manifest
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN"]
    args:
      - -c
      - |
        set -euo pipefail
        git config user.name "cloud-build[bot]"
        git config user.email "cloud-build[bot]@scout.trainerlab.io"
        git remote set-url origin "https://x-access-token:$$GITHUB_TOKEN@github.com/dtsong/tcg-scout.git"
        git add web/data-manifest.json
        git diff --cached --quiet && { echo "No manifest changes"; exit 0; }
        git commit -m "data: scrape $$(date -u +%Y-%m-%dT%H:%MZ)"
        # Race-tolerant push: another pipeline (e.g. tcg-scout-decklists) may
        # have advanced main between our checkout and now. Rebase + retry.
        for attempt in 1 2 3; do
          if git push origin HEAD:main; then exit 0; fi
          echo "push rejected, fetching and rebasing (attempt $$attempt)..."
          git fetch origin main
          git rebase origin/main || { git rebase --abort; exit 1; }
        done
        echo "ERROR: push failed after 3 attempts" >&2
        exit 1
    waitFor: ["upload-data"]

substitutions:
  _CACHE_BUCKET: tcg-scout-cache
  _DATA_BUCKET: tcg-scout-data
  # Formats whose JP City League results are scraped each run. Keep in sync with
  # the active format in config.FORMATS -- `scout formats-list --status active`.
  # tpci-standard is active but ingested out of band, so it is not listed here.
  _SCRAPE_FORMATS: abyss-eye
  # Frozen formats, restored from GCS snapshots instead of being recomputed.
  # Must match `scout formats-list --status frozen`.
  _FROZEN_FORMATS: nihil-zero ninja-spinner tpci-standard-2025 tpci-standard-2024

# Headroom for the one-time frozen-snapshot seeding run, which exports every
# frozen format. Steady-state runs restore those and finish far inside this.
timeout: 7200s
options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN
