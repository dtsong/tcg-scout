steps:
  # Restore cached SQLite databases from GCS
  - id: restore-db-cache
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        gsutil -m cp "gs://${_CACHE_BUCKET}/scout-dbs/*.db" data/ || echo "WARNING: DB cache restore failed (exit $?), starting fresh"

  # Restore frozen format data (nihil-zero) so formats.json includes it
  - id: restore-frozen
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p /workspace/web/public/data/nihil-zero
        gsutil cp "gs://${_CACHE_BUCKET}/frozen/nihil-zero-data.tar.gz" /tmp/nihil-zero.tar.gz
        tar -xzf /tmp/nihil-zero.tar.gz -C /workspace/web/public/data/nihil-zero
        echo "Restored frozen nihil-zero data"

  # Single Python step -- pip installs don't persist across containers
  - id: scrape
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt &&
        python cli.py --format ninja-spinner init &&
        python cli.py --format ninja-spinner scrape --no-decklists &&
        python cli.py --format ninja-spinner scrape-jp --no-decklists &&
        python cli.py --format ninja-spinner backfill-archetypes &&
        python cli.py --format ninja-spinner translate-cards &&
        python cli.py --format ninja-spinner meta &&
        python cli.py --format ninja-spinner export-web --strict
    waitFor: ["restore-db-cache", "restore-frozen"]

  # Validate exported data and database integrity before saving
  - id: validate
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt &&
        python cli.py --format ninja-spinner validate
    waitFor: ["scrape"]

  # Save SQLite databases to GCS for next run
  - id: save-db-cache
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - gsutil -m cp data/*.db "gs://${_CACHE_BUCKET}/scout-dbs/"
    waitFor: ["validate"]

  # Tar and upload exported JSON data to GCS
  - id: upload-data
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        TIMESTAMP=$$(date -u +%Y%m%dT%H%M%SZ)
        TAR_FILE="data-$${TIMESTAMP}.tar.gz"
        GCS_PATH="gs://${_DATA_BUCKET}/$${TAR_FILE}"

        echo "Creating data archive..."
        tar -czf "/tmp/$${TAR_FILE}" --exclude='._*' -C /workspace/web/public/data .

        echo "Uploading to $${GCS_PATH}..."
        gsutil cp "/tmp/$${TAR_FILE}" "$${GCS_PATH}"
        gsutil cp "$${GCS_PATH}" "gs://${_DATA_BUCKET}/data-latest.tar.gz"

        echo "Generating signed URL (valid 24h)..."
        SIGNED_URL=$$(gcloud storage sign-url "$${GCS_PATH}" \
          --impersonate-service-account="${_SIGNER_SA}" \
          --region=us-central1 \
          --duration=12h --quiet 2>/dev/null \
          | grep 'signed_url:' | sed 's/signed_url: //')

        SHA256=$$(sha256sum "/tmp/$${TAR_FILE}" | cut -d' ' -f1)

        echo "Writing manifest..."
        cat > /workspace/web/data-manifest.json <<MANIFEST_EOF
        {
          "version": 1,
          "archives": [
            {
              "url": "$${SIGNED_URL}",
              "sha256": "$${SHA256}",
              "created_at": "$${TIMESTAMP}"
            }
          ]
        }
        MANIFEST_EOF

        echo "Manifest written. SHA-256: $${SHA256}"
    waitFor: ["save-db-cache"]

  # Commit manifest and push (lightweight, no JSON data)
  - id: push-manifest
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN"]
    args:
      - -c
      - |
        git config user.name "cloud-build[bot]"
        git config user.email "cloud-build[bot]@scout.trainerlab.io"
        git remote set-url origin "https://x-access-token:$$GITHUB_TOKEN@github.com/dtsong/tcg-scout.git"
        git add web/data-manifest.json
        git diff --cached --quiet && { echo "No manifest changes"; exit 0; }
        git commit -m "data: scrape $$(date -u +%Y-%m-%dT%H:%MZ)"
        git push origin HEAD:main
    waitFor: ["upload-data"]

substitutions:
  _CACHE_BUCKET: tcg-scout-cache
  _DATA_BUCKET: tcg-scout-data
  _SIGNER_SA: scout-data-signer@trainerlab-prod.iam.gserviceaccount.com

timeout: 2700s
options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN
