repos:
  # Python: ruff lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Frontend: typecheck only (fast, <5s)
  # Full tests (pytest, vitest, next build) run in CI
  - repo: local
    hooks:
      - id: tsc
        name: typecheck
        entry: bash -c 'cd web && source ~/.nvm/nvm.sh && nvm use default --silent && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^web/
        stages: [pre-commit]
