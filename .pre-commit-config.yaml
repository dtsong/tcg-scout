repos:
  # Python: ruff lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Python: tests
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest tests/ -x -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Frontend: lint + typecheck + tests
  - repo: local
    hooks:
      - id: next-build
        name: next build
        entry: bash -c 'cd web && source ~/.nvm/nvm.sh && nvm use default --silent && npx next build'
        language: system
        pass_filenames: false
        files: ^web/
        stages: [pre-commit]

      - id: tsc
        name: typecheck
        entry: bash -c 'cd web && source ~/.nvm/nvm.sh && nvm use default --silent && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^web/
        stages: [pre-commit]

      - id: vitest
        name: vitest
        entry: bash -c 'cd web && source ~/.nvm/nvm.sh && nvm use default --silent && npx vitest run'
        language: system
        pass_filenames: false
        files: ^web/
        stages: [pre-commit]
