# Daily decklist backfill pipeline.
#
# The 3-hourly cloudbuild-scrape.yaml runs with --no-decklists to stay within
# its 45-min window. This pipeline picks up the decklists separately so the
# fast scrape stays lean.
#
# One-time setup
# --------------
# 1. Store the Kernel API key (used by Playwright cloud browsers):
#      gcloud secrets create kernel-api-key --replication-policy=automatic
#      printf '%s' "$KERNEL_API_KEY" | gcloud secrets versions add kernel-api-key --data-file=-
#      gcloud secrets add-iam-policy-binding kernel-api-key \
#        --member="serviceAccount:$(gcloud projects describe "$PROJECT_ID" \
#          --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#        --role=roles/secretmanager.secretAccessor
#
# 2. Reuse the existing github-token secret from cloudbuild-scrape.yaml.
#
# 3. Create the Cloud Build trigger (manual or scheduled):
#      gcloud builds triggers create manual \
#        --name=tcg-scout-decklists \
#        --repo=https://github.com/dtsong/tcg-scout \
#        --branch=main \
#        --build-config=cloudbuild-decklists.yaml
#
# 4. Schedule daily via Cloud Scheduler (runs once at 06:00 UTC = 15:00 JST):
#      gcloud scheduler jobs create http tcg-scout-decklists-daily \
#        --schedule="0 6 * * *" \
#        --uri="https://cloudbuild.googleapis.com/v1/projects/$PROJECT_ID/triggers/tcg-scout-decklists:run" \
#        --http-method=POST \
#        --oauth-service-account-email="$(gcloud projects describe "$PROJECT_ID" \
#          --format='value(projectNumber)')-compute@developer.gserviceaccount.com" \
#        --message-body='{"branchName":"main"}'
#
# Manual one-off backfills (for the 19-day pre-pipeline gap)
# ----------------------------------------------------------
# Trigger with custom substitutions to widen the window:
#      gcloud builds triggers run tcg-scout-decklists --branch=main \
#        --substitutions=_LIMIT=2000
# or run cli.py locally:
#      uv run scout --format ninja-spinner backfill-decklists --since 2026-04-06

steps:
  # Restore cached SQLite databases from GCS
  - id: restore-db-cache
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p data
        gsutil -m cp "gs://${_CACHE_BUCKET}/scout-dbs/*.db" data/ || {
          echo "ERROR: DB cache restore failed (exit $?). Cannot backfill against an empty DB.";
          exit 1;
        }

  # Restore frozen format data (nihil-zero) so formats.json includes it
  - id: restore-frozen
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p /workspace/web/public/data/nihil-zero
        gsutil cp "gs://${_CACHE_BUCKET}/frozen/nihil-zero-data.tar.gz" /tmp/nihil-zero.tar.gz
        tar -xzf /tmp/nihil-zero.tar.gz -C /workspace/web/public/data/nihil-zero
        echo "Restored frozen nihil-zero data"

  # Backfill missing decklists for placements ingested by the lean 3-hour scrape.
  # Playwright + Kernel cloud browsers handle JP fetches; plain httpx for Limitless.
  - id: backfill-decklists
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    entrypoint: bash
    secretEnv: ["KERNEL_API_KEY"]
    env: ["UV_CACHE_DIR=/workspace/.uv-cache"]
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --locked --no-dev
        uv run python cli.py --format ninja-spinner init
        # Bound the run to recent placements; older gaps can be backfilled
        # manually via `--since YYYY-MM-DD` from a one-off run.
        uv run python cli.py --format ninja-spinner backfill-decklists \
          --since "$$(date -u -d '14 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-14d +%Y-%m-%d)" \
          --pool-size ${_POOL_SIZE} \
          --limit ${_LIMIT}
        # Re-export so the next manifest reflects fresh card-level data.
        uv run python cli.py --format ninja-spinner translate-cards
        uv run python cli.py --format ninja-spinner meta
        uv run python cli.py --format ninja-spinner export-web --strict
        # tpci-standard isn't scraped here; re-export from its cached DB
        # (precomputed meta) so it stays in the published tarball + formats.json.
        uv run python cli.py --format tpci-standard export-web --strict
        # tpci-standard-2025: frozen historical format (2025 spring rotation),
        # same cached-DB re-export so it stays published + in formats.json.
        uv run python cli.py --format tpci-standard-2025 export-web --strict
    waitFor: ["restore-db-cache", "restore-frozen"]

  # Validate exported data and database integrity before saving
  - id: validate
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    entrypoint: bash
    env: ["UV_CACHE_DIR=/workspace/.uv-cache"]
    args:
      - -c
      - |
        uv sync --locked --no-dev &&
        uv run python cli.py --format ninja-spinner validate
    waitFor: ["backfill-decklists"]

  # Save SQLite databases to GCS for next run
  - id: save-db-cache
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - gsutil -m cp data/*.db "gs://${_CACHE_BUCKET}/scout-dbs/"
    waitFor: ["validate"]

  # Tar and upload exported JSON data to GCS
  - id: upload-data
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        TIMESTAMP=$$(date -u +%Y%m%dT%H%M%SZ)
        TAR_FILE="data-$${TIMESTAMP}.tar.gz"
        GCS_PATH="gs://${_DATA_BUCKET}/$${TAR_FILE}"
        PUBLIC_URL="https://storage.googleapis.com/${_DATA_BUCKET}/data-latest.tar.gz"

        echo "Creating data archive..."
        tar -czf "/tmp/$${TAR_FILE}" --exclude='._*' -C /workspace/web/public/data .

        echo "Uploading to $${GCS_PATH}..."
        gsutil cp "/tmp/$${TAR_FILE}" "$${GCS_PATH}"
        gsutil cp "$${GCS_PATH}" "gs://${_DATA_BUCKET}/data-latest.tar.gz"

        SHA256=$$(sha256sum "/tmp/$${TAR_FILE}" | cut -d' ' -f1)

        echo "Writing manifest..."
        cat > /workspace/web/data-manifest.json <<MANIFEST_EOF
        {
          "version": 1,
          "archives": [
            {
              "url": "$${PUBLIC_URL}",
              "sha256": "$${SHA256}",
              "created_at": "$${TIMESTAMP}"
            }
          ]
        }
        MANIFEST_EOF

        echo "Manifest written. SHA-256: $${SHA256}"
    waitFor: ["save-db-cache"]

  # Commit manifest and push (lightweight, no JSON data)
  - id: push-manifest
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN"]
    args:
      - -c
      - |
        set -euo pipefail
        git config user.name "cloud-build[bot]"
        git config user.email "cloud-build[bot]@scout.trainerlab.io"
        git remote set-url origin "https://x-access-token:$$GITHUB_TOKEN@github.com/dtsong/tcg-scout.git"
        git add web/data-manifest.json
        git diff --cached --quiet && { echo "No manifest changes"; exit 0; }
        git commit -m "data: decklist backfill $$(date -u +%Y-%m-%dT%H:%MZ)"
        # Race-tolerant push: tcg-scout-scrape may have advanced main since
        # our gitFileSource checkout. Rebase + retry on rejection.
        for attempt in 1 2 3; do
          if git push origin HEAD:main; then exit 0; fi
          echo "push rejected, fetching and rebasing (attempt $$attempt)..."
          git fetch origin main
          git rebase origin/main || { git rebase --abort; exit 1; }
        done
        echo "ERROR: push failed after 3 attempts" >&2
        exit 1
    waitFor: ["upload-data"]

substitutions:
  _CACHE_BUCKET: tcg-scout-cache
  _DATA_BUCKET: tcg-scout-data
  _POOL_SIZE: "5"
  _LIMIT: "200"

# Decklist fetching is slower than the lean scrape; allow more headroom.
timeout: 5400s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/kernel-api-key/versions/latest
      env: KERNEL_API_KEY
