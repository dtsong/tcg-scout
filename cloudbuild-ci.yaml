steps:
  # ── Python CI (single step -- pip installs don't persist across containers) ──
  - id: python-ci
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt -r functions/poll_tournaments/requirements.txt ruff pytest &&
        ruff check . &&
        ruff format --check . &&
        pytest tests/ -v

  # ── Frontend CI ──
  # /workspace is shared across steps, so node_modules persists
  - id: npm-install
    name: node:22-slim
    entrypoint: npm
    args: ["ci"]
    dir: web
    waitFor: ["-"]

  - id: typecheck
    name: node:22-slim
    entrypoint: npx
    args: ["tsc", "--noEmit"]
    dir: web
    waitFor: ["npm-install"]

  - id: frontend-test
    name: node:22-slim
    entrypoint: npx
    args: ["vitest", "run"]
    dir: web
    waitFor: ["npm-install"]

  - id: frontend-build
    name: node:22-slim
    entrypoint: npm
    args: ["run", "build"]
    dir: web
    waitFor: ["typecheck", "frontend-test"]

timeout: 600s
options:
  logging: CLOUD_LOGGING_ONLY
