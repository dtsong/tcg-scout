steps:
  # ── Python CI (single step -- each step is a fresh container) ──
  # `uv sync` installs the dev group (ruff) + test group (pytest + Cloud Function
  # deps), so the old `-r functions/poll_tournaments/requirements.txt` is covered.
  # `--locked` fails if uv.lock is stale vs pyproject.toml.
  - id: python-ci
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    entrypoint: bash
    args:
      - -c
      - |
        uv sync --locked &&
        uv run ruff check . &&
        uv run ruff format --check . &&
        uv run pytest tests/ -v

  # ── Frontend CI ──
  # /workspace is shared across steps, so node_modules persists
  - id: npm-install
    name: node:22-slim
    entrypoint: npm
    args: ["ci"]
    dir: web
    waitFor: ["-"]

  - id: typecheck
    name: node:22-slim
    entrypoint: npx
    args: ["tsc", "--noEmit"]
    dir: web
    waitFor: ["npm-install"]

  - id: frontend-lint
    name: node:22-slim
    entrypoint: npx
    args: ["eslint", ".", "--quiet"]
    dir: web
    waitFor: ["npm-install"]

  - id: frontend-test
    name: node:22-slim
    entrypoint: npx
    args: ["vitest", "run"]
    dir: web
    waitFor: ["npm-install"]

  - id: frontend-build
    name: node:22-slim
    entrypoint: npm
    args: ["run", "build"]
    dir: web
    waitFor: ["typecheck", "frontend-lint", "frontend-test"]

  - id: export-validation
    name: node:22-slim
    entrypoint: npm
    args: ["run", "test:export"]
    dir: web
    waitFor: ["frontend-build"]

  # Playwright image bundles Chromium + system deps (libglib, libnss, etc.).
  # Tag must match @playwright/test version pinned in package-lock.json (1.58.2).
  - id: e2e-smoke
    name: mcr.microsoft.com/playwright:v1.58.2-jammy
    entrypoint: npm
    args: ["run", "test:e2e:smoke"]
    dir: web
    waitFor: ["frontend-build"]

  - id: e2e-assets
    name: mcr.microsoft.com/playwright:v1.58.2-jammy
    entrypoint: npm
    args: ["run", "test:e2e:assets"]
    dir: web
    waitFor: ["e2e-smoke"]

  - id: e2e-render
    name: mcr.microsoft.com/playwright:v1.58.2-jammy
    entrypoint: npm
    args: ["run", "test:e2e:render"]
    dir: web
    waitFor: ["e2e-assets"]

  - id: e2e-performance
    name: mcr.microsoft.com/playwright:v1.58.2-jammy
    entrypoint: npm
    args: ["run", "test:e2e:performance"]
    dir: web
    waitFor: ["e2e-render"]

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
