steps:
  # ── Python CI (single step -- pip installs don't persist across containers) ──
  - id: python-ci
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt -r functions/poll_tournaments/requirements.txt ruff pytest &&
        ruff check . &&
        ruff format --check . &&
        pytest tests/ -v

  # ── Frontend CI ──
  # /workspace is shared across steps, so node_modules persists
  - id: npm-install
    name: node:22-slim
    entrypoint: npm
    args: ["ci"]
    dir: web
    waitFor: ["-"]

  - id: typecheck
    name: node:22-slim
    entrypoint: npx
    args: ["tsc", "--noEmit"]
    dir: web
    waitFor: ["npm-install"]

  - id: frontend-test
    name: node:22-slim
    entrypoint: npx
    args: ["vitest", "run"]
    dir: web
    waitFor: ["npm-install"]

  - id: playwright-install
    name: node:22-slim
    entrypoint: npx
    args: ["playwright", "install", "--with-deps", "chromium"]
    dir: web
    waitFor: ["npm-install"]

  - id: frontend-build
    name: node:22-slim
    entrypoint: npm
    args: ["run", "build"]
    dir: web
    waitFor: ["typecheck", "frontend-test"]

  - id: export-validation
    name: node:22-slim
    entrypoint: npm
    args: ["run", "test:export"]
    dir: web
    waitFor: ["frontend-build"]

  - id: e2e-smoke
    name: node:22-slim
    entrypoint: npm
    args: ["run", "test:e2e:smoke"]
    dir: web
    waitFor: ["frontend-build", "playwright-install"]

  - id: e2e-assets
    name: node:22-slim
    entrypoint: npm
    args: ["run", "test:e2e:assets"]
    dir: web
    waitFor: ["e2e-smoke"]

  - id: e2e-render
    name: node:22-slim
    entrypoint: npm
    args: ["run", "test:e2e:render"]
    dir: web
    waitFor: ["e2e-assets"]

  - id: e2e-performance
    name: node:22-slim
    entrypoint: npm
    args: ["run", "test:e2e:performance"]
    dir: web
    waitFor: ["e2e-render"]

timeout: 600s
options:
  logging: CLOUD_LOGGING_ONLY
