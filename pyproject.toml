[project]
name = "trainerlab-scout"
version = "0.1.0"
description = "JP rotation meta scout for Pokemon TCG"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
    "rich>=13.0",
    "kernel>=0.1",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "jinja2>=3.1",
]

[dependency-groups]
# PEP 735 groups. `uv sync` installs the `dev` group by default; `dev` pulls in
# `test` so a default sync can run the full suite + lint gate.
# `test` mirrors functions/poll_tournaments/requirements.txt (Cloud Function
# deploy deps) so tests/test_poll_tournaments.py can import functions_framework.
test = [
    "pytest>=8.0",
    "functions-framework==3.*",
    "google-cloud-storage==2.*",
    "google-cloud-build==3.*",
]
dev = [
    "ruff>=0.15",
    {include-group = "test"},
]

[project.scripts]
scout = "cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli.py", "config.py", "db.py", "scraper", "analysis", "reports"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",   # line-too-long (let formatter handle)
]

[tool.ruff.lint.isort]
known-first-party = ["scraper", "analysis", "reports", "config", "db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests spanning multiple modules or the full pipeline",
    "slow: tests that take >5s (frozen DB, large fixtures)",
]
