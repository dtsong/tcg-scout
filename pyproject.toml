[project]
name = "trainerlab-scout"
version = "0.1.0"
description = "JP rotation meta scout for Pokemon TCG"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
    "rich>=13.0",
    "kernel>=0.1",
    "playwright>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
scout = "cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli.py", "config.py", "db.py", "scraper", "analysis", "reports"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",   # line-too-long (let formatter handle)
]

[tool.ruff.lint.isort]
known-first-party = ["scraper", "analysis", "reports", "config", "db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
