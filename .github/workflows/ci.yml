name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/public/data/**"
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # uv installs the Python pinned in .python-version (3.12) and caches deps.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        # dev group = ruff + test group (pytest + Cloud Function deps)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest tests/ -m "not integration" -v

      - name: Integration tests
        run: uv run pytest tests/ -m integration -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --quiet

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -d out && ls out/ | grep -q . || (echo "Build output directory missing or empty" && exit 1)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test e2e/smoke.spec.ts

      - name: Visual regression tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx playwright test e2e/render.spec.ts

      - name: Upload visual snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots
          path: web/e2e/render.spec.ts-snapshots/
          if-no-files-found: ignore
