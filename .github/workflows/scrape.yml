name: Daily Scrape & Deploy

# Disabled while GitHub Actions minutes are exhausted -- using Cloud Build
# on:
#   schedule:
#     - cron: "0 12 * * *"
#   workflow_dispatch:
#     inputs:
#       format:
#         description: "Format to scrape (or 'all')"
#         required: false
#         default: "all"
on: workflow_dispatch

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache SQLite databases between runs so scrapes are incremental
      - name: Restore DB cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/*.db
          key: scout-dbs-${{ github.ref_name }}
          restore-keys: scout-dbs-

      - name: Initialize database
        run: python cli.py --format ninja-spinner init

      - name: Scrape Ninja Spinner
        run: |
          python cli.py --format ninja-spinner scrape
          python cli.py --format ninja-spinner meta
          python cli.py --format ninja-spinner export-web

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet web/public/data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/
          git commit -m "data: daily scrape $(date -u +%Y-%m-%d) [skip ci]"
          git push
