name: Daily Scrape & Deploy

# Disabled while GitHub Actions minutes are exhausted -- using Cloud Build
# on:
#   schedule:
#     - cron: "0 12 * * *"
#   workflow_dispatch:
#     inputs:
#       format:
#         description: "Format to scrape (or 'all')"
#         required: false
#         default: "all"
on: workflow_dispatch

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # uv installs the Python pinned in .python-version (3.12) and caches deps.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # Cache SQLite databases between runs so scrapes are incremental
      - name: Restore DB cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/*.db
          key: scout-dbs-${{ github.ref_name }}
          restore-keys: scout-dbs-

      - name: Initialize database
        run: uv run python cli.py --format ninja-spinner init

      - name: Scrape Ninja Spinner
        run: |
          uv run python cli.py --format ninja-spinner scrape
          uv run python cli.py --format ninja-spinner meta
          uv run python cli.py --format ninja-spinner export-web

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet web/public/data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/
          git commit -m "data: daily scrape $(date -u +%Y-%m-%d) [skip ci]"
          git push
